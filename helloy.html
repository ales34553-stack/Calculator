<!DOCTYPE html>
<html>
    <head><title>table</title>
        <style>
            table {
                border-collapse: collapse;
                text-align: center;
                font-family: courier;
                width: 100%;
                border: tomato;
            }
            td, th {
                border: 1px solid #dddddd;
                text-align: left;
                padding: 8px;
            }
        </style>
    </head>
<body>
    <h1>table</h1>
    <table>
        <tr>
            <th>name</th>
            <th>I.D</th>
            <th>demp.</th>
        </tr>
        <tr>
            <td>jay</td>
            <td>123</td>
            <td>finance</td>
        </tr>
        <tr>
            <td>rahul3</td>
            <td></td>
        </tr>

    </table>

</body>
</html>
